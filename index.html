<title>등급컷 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 아이소타이프 스타일: 연회색 바탕, 숯색 글자, 주황 강조 하나. 그림자와 장식 없이 단색 면과 사람 픽토그램의 반복으로 수량을 표현한다.
   레이아웃은 12칸 격자에 맞춘 왼쪽 정렬 블록들. 라이트 한 가지 모습만 쓴다. */
:root{
  --bg:#f0f0f0; --fg:#333333; --accent:#ff8c00; --panel:#ffffff; --muted:#5f5f5f; --line:#333333; --bar:#bdbdbd; --warn:#a63a00;
  --sans:"Helvetica Neue",Helvetica,Arial,"Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:16px}
.content{display:flex;flex-direction:column;gap:20px;min-width:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.pair>section[hidden]{display:none}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static}}
@media(max-width:760px){.pair{grid-template-columns:minmax(0,1fr)}}
header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:1.7rem;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px;min-width:0;border-top:6px solid var(--line);padding-top:12px}
h2{font-size:1.1rem;font-weight:900;margin:0;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;background:var(--fg);flex:none}
label,.note{font-size:.85rem;color:var(--muted)}
.note{margin:0}
.drop{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--panel);border:3px solid var(--line);padding:16px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);outline:3px solid var(--accent)}
.drop:focus-within{outline:3px solid var(--accent)}
.drop svg{width:44px;height:30px;color:var(--fg)}
.drop b{font-size:1.1rem;font-weight:900;display:block;line-height:1.3}
.drop span{font-size:.85rem;color:var(--muted)}
.drop .btn{background:var(--fg);color:#fff;padding:10px 18px;font-weight:700;font-size:.9rem;white-space:nowrap}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop .btn{align-self:stretch;text-align:center}
select,input[type=number]{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:0;padding:8px 10px;width:100%;box-sizing:border-box}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.ratios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.msg{color:var(--warn);font-weight:700;font-size:.9rem;min-height:1.2em}
#meta{color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--panel);padding:8px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:.8rem;color:var(--muted)}
.stat strong{font-size:1.3rem;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.stat.main{background:var(--fg);color:#fff}
.stat.main small{color:#d6d6d6}
.grades{display:flex;flex-direction:column;gap:4px}
.grow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--panel);padding:6px 12px 6px 6px}
.gno{background:var(--fg);color:#fff;font-weight:900;font-size:1rem;height:34px;display:flex;align-items:center;justify-content:center}
.gcut{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:10px;font-variant-numeric:tabular-nums;min-width:0}
.gcut b{font-size:1.35rem;font-weight:900;line-height:1.2;letter-spacing:-.01em;border-bottom:3px solid var(--accent)}
.gcut span{font-size:.82rem;color:var(--muted)}
.gcut.none b{border-bottom-color:var(--bar);color:var(--muted);font-size:1.1rem}
.ginfo{display:flex;align-items:baseline;gap:8px;justify-content:flex-end;flex-wrap:wrap;font-variant-numeric:tabular-nums;text-align:right}
.ginfo b{font-size:1.05rem;font-weight:900}
.ginfo span{font-size:.78rem;color:var(--muted)}
@media(max-width:620px){.grow{grid-template-columns:34px minmax(0,1fr)}.ginfo{grid-column:2;justify-content:flex-start}}
.placeholder{background:var(--panel);padding:20px;color:var(--muted)}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.cls{background:var(--panel);padding:10px 14px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.cls svg{width:30px;height:26px;grid-row:1 / 3;color:var(--fg)}
.cls b{font-weight:900;font-size:1.05rem;line-height:1.2}
.cls small{color:var(--muted);font-size:.78rem;line-height:1.3}
.histwrap{background:var(--panel);padding:14px 14px 8px}
.hist{display:flex;align-items:flex-end;gap:3px;height:130px;border-bottom:3px solid var(--line)}
.hist i{flex:1;min-width:0;background:var(--bar)}
.hist i.hi{background:var(--fg)}
.axis{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="b" viewBox="0 0 30 26">
    <polygon points="0,8 15,0 30,8" fill="currentColor"/>
    <rect x="2" y="9" width="26" height="17" fill="currentColor"/>
    <rect x="5" y="12" width="5" height="5" style="fill:var(--panel)"/>
    <rect x="12.5" y="12" width="5" height="5" style="fill:var(--panel)"/>
    <rect x="20" y="12" width="5" height="5" style="fill:var(--panel)"/>
    <rect x="12" y="19" width="6" height="7" style="fill:var(--panel)"/>
  </symbol>
  <symbol id="f" viewBox="0 0 44 30">
    <rect x="0" y="6" width="44" height="24" fill="currentColor"/>
    <rect x="0" y="0" width="18" height="8" fill="currentColor"/>
    <rect x="18" y="14" width="8" height="10" style="fill:var(--accent)"/>
    <polygon points="22,8 30,15 14,15" style="fill:var(--accent)"/>
  </symbol>
</svg>

<main>
  <header>
    <div>
      <h1>등급컷 계산기</h1>
      <p class="sub">나이스 교과목별 일람표 파일을 올리면 응시 인원과 등급컷이 바로 나옵니다.</p>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <section>
        <h2>파일과 기준</h2>
        <label class="drop" id="drop">
          <svg aria-hidden="true"><use href="#f"/></svg>
          <b>XLS 파일을 끌어다 놓기</b>
          <span>나이스 · 교과담임 · 정기시험조회 · 교과목별일람표조회(전체학급)에서 저장한 파일</span>
          <span class="btn">파일 선택</span>
          <input id="file" type="file" accept=".xls,.xlsx,.csv,.html,.htm">
        </label>
        <div class="note" id="fstat" aria-live="polite"></div>
        <div id="meta" class="note"></div>
        <div class="field">
          <label for="preset">등급제</label>
          <select id="preset">
            <option value="5">5등급제 (10·24·32·24·10%)</option>
            <option value="9">9등급제 (4·7·12·17·20·17·12·7·4%)</option>
            <option value="custom">직접 입력</option>
          </select>
        </div>
        <div class="ratios" id="ratios"></div>
        <div class="field">
          <label for="round">경계 인원 처리</label>
          <select id="round">
            <option value="round">반올림</option>
            <option value="floor">내림</option>
            <option value="ceil">올림</option>
          </select>
        </div>
        <div class="msg" id="msg"></div>
      </section>
    </aside>

    <div class="content">
      <section>
        <h2>등급컷</h2>
        <div class="stats" id="stats"></div>
        <div class="grades" id="out"></div>
        <p class="note">컷 점수와 같은 점수는 모두 위 등급으로 올립니다. 그래서 동점이 많으면 인원이 0명인 등급이 생길 수 있습니다.</p>
      </section>

      <div class="pair">
        <section id="classcard" hidden>
          <h2>반별 현황</h2>
          <div class="classes" id="classes"></div>
        </section>
        <section>
          <h2>점수 분포</h2>
          <div class="histwrap">
            <div class="hist" id="hist" role="img" aria-label="점수 분포 막대그래프"></div>
            <div class="axis"><span>0점</span><span id="ax-mid">50점</span><span id="ax-top">100점</span></div>
          </div>
          <p class="note">20구간으로 나눈 분포이고, 검은 막대는 등급컷이 있는 구간입니다.</p>
        </section>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  var PRESETS={"9":[4,7,12,17,20,17,12,7,4],"5":[10,24,32,24,10]};
  var $=function(id){return document.getElementById(id)};
  var ratios=PRESETS["5"].slice(),scores=[];
  var table=[],fname="";

  function renderRatios(){
    var box=$("ratios");box.innerHTML="";
    ratios.forEach(function(v,i){
      var d=document.createElement("div");d.className="field";
      d.innerHTML='<label for="r'+i+'">'+(i+1)+'등급 (%)</label><input id="r'+i+'" type="number" min="0" max="100" step="0.1" value="'+v+'">';
      box.appendChild(d);
      d.querySelector("input").addEventListener("input",function(e){
        ratios[i]=parseFloat(e.target.value)||0;$("preset").value="custom";calc();
      });
    });
  }
  function fmt(x){return Math.round(x*100)/100}

  function calc(){
    var sc=scores.slice().sort(function(a,b){return b-a});
    var n=sc.length,msg=$("msg"),out=$("out");
    var sum=ratios.reduce(function(a,b){return a+b},0);
    msg.textContent=Math.abs(sum-100)>0.001?"비율의 합이 "+fmt(sum)+"%입니다. 100%로 맞춰 주세요.":"";
    if(!n){
      out.innerHTML='<div class="placeholder">파일을 올리면 등급컷이 여기에 나타납니다.</div>';
      $("stats").innerHTML="";drawHist([],[]);return;
    }
    var mode=$("round").value,cum=0,prev=Infinity,list=[],cuts=[];
    ratios.forEach(function(p,i){
      cum+=p;
      var k=Math[mode](n*cum/100+1e-9);
      k=Math.max(0,Math.min(n,k));
      var cut=k>0?sc[k-1]:null;
      if(i===ratios.length-1)cut=sc[n-1];
      var cnt=0,valid=cut!==null&&cut<prev,hi=prev;
      if(valid){sc.forEach(function(x){if(x>=cut&&x<prev)cnt++});prev=cut;cuts.push(cut)}
      list.push({g:i+1,p:p,c:cum,k:k,cut:valid?cut:null,hi:hi,n:cnt});
    });
    out.innerHTML=list.map(function(r){
      var cutHtml=r.cut===null
        ?'<div class="gcut none"><b>해당 없음</b><span>컷 점수가 윗등급과 같음</span></div>'
        :'<div class="gcut"><b>'+fmt(r.cut)+'점 이상</b><span>'+(r.hi===Infinity?'~ '+fmt(sc[0])+'점 (최고점)':'~ '+fmt(r.hi)+'점 미만')+'</span></div>';
      return '<div class="grow"><div class="gno">'+r.g+'</div>'+cutHtml+
        '<div class="ginfo"><b>'+r.n+'명</b><span>누적 '+fmt(r.c)+'% · 경계 순위 '+r.k+'위</span></div></div>';
    }).join("");
    var mean=sc.reduce(function(a,b){return a+b},0)/n;
    var sd=Math.sqrt(sc.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/n);
    $("stats").innerHTML=
      '<div class="stat main"><small>응시 인원</small><strong>'+n+'명</strong></div>'+
      '<div class="stat"><small>평균</small><strong>'+fmt(mean)+'</strong></div>'+
      '<div class="stat"><small>표준편차</small><strong>'+fmt(sd)+'</strong></div>'+
      '<div class="stat"><small>최고 · 최저</small><strong>'+fmt(sc[0])+' · '+fmt(sc[n-1])+'</strong></div>';
    drawHist(sc,cuts);
  }
  function drawHist(sc,cuts){
    var mxs=sc.length?Math.max.apply(null,sc):100;
    var top=mxs>100?Math.ceil(mxs/10)*10:100,step=top/20;
    $("ax-mid").textContent=top/2+"점";$("ax-top").textContent=top+"점";
    var bins=new Array(21).fill(0);
    sc.forEach(function(x){bins[Math.min(20,Math.max(0,Math.floor(x/step)))]++});
    var mx=Math.max.apply(null,bins.concat([1]));
    $("hist").innerHTML=bins.map(function(c,i){
      var isCut=cuts.some(function(t){return Math.min(20,Math.floor(t/step))===i});
      return '<i class="'+(isCut?'hi':'')+'" style="height:'+Math.max(c?3:0,c/mx*100)+'%" title="'+fmt(i*step)+'점대 '+c+'명"></i>';
    }).join("");
  }

  function decode(buf){
    var b=new Uint8Array(buf),head="";
    for(var i=0;i<Math.min(400,b.length);i++)head+=String.fromCharCode(b[i]);
    if(!/<\s*(html|table|\?xml)/i.test(head))return null;
    try{return new TextDecoder("utf-8",{fatal:true}).decode(b)}catch(e){return new TextDecoder("euc-kr").decode(b)}
  }
  function num(v){
    if(typeof v==="number")return v;
    if(typeof v==="string"&&/^\s*-?\d+(\.\d+)?\s*$/.test(v))return Number(v);
    return null;
  }
  function txt(v){return String(v===undefined||v===null?"":v).replace(/\s+/g," ").trim()}
  function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
  function loadFile(f){
    var rd=new FileReader();
    rd.onload=function(e){
      try{
        var t=decode(e.target.result);
        var wb=t!==null?XLSX.read(t,{type:"string"}):XLSX.read(e.target.result,{type:"array"});
        table=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:true});
        fname=f.name;analyze();
      }catch(err){$("fstat").textContent="파일을 읽지 못했습니다. 나이스에서 저장한 XLS 파일인지 확인해 주세요."}
    };
    rd.readAsArrayBuffer(f);
  }
  // 일람표 구조: 왼쪽 위 칸이 '반번호', 오른쪽으로 반(1,2,3...), 아래로 번호(1,2,3...), 칸마다 점수.
  // 점수 아래쪽에는 응시인원·합계·평균 줄이 있어 점수 영역에서 제외한다.
  function analyze(){
    var st=$("fstat"),h=-1,k=0,i,c;
    // '반번호' 칸은 A열이 아니어도 되고, 그 오른쪽에 반 번호(숫자)가 하나 이상 있으면 머리글 줄로 본다.
    for(i=0;i<Math.min(table.length,40)&&h<0;i++){
      for(c=0;c<table[i].length&&h<0;c++){
        var a=txt(table[i][c]).replace(/\s/g,"");
        if(/반/.test(a)&&/번호/.test(a)&&table[i].slice(c+1).some(function(v){return num(v)!==null})){h=i;k=c}
      }
    }
    if(h<0){st.textContent="'반번호' 머리글을 찾지 못했습니다. 교과목별 일람표 파일이 맞는지 확인해 주세요.";return}
    var cls=[];
    for(c=k+1;c<table[h].length;c++)if(num(table[h][c])!==null)cls.push(c);
    scores=[];var per={},absent=0,end=table.length;
    cls.forEach(function(c){per[c]=[]});
    for(i=h+1;i<table.length;i++){
      if(num(table[i][k])===null){
        if(txt(table[i][k])){end=i;break}
        continue;
      }
      cls.forEach(function(c){
        var n=num(table[i][c]);
        if(n!==null){n=Number(n.toFixed(2));scores.push(n);per[c].push(n)}
        else if(txt(table[i][c]))absent++;
      });
    }
    var fileN=null;
    for(i=end;i<table.length;i++){
      if(/응시/.test(txt(table[i][k]))){
        fileN=0;cls.forEach(function(c){var m=parseInt(txt(table[i][c]),10);if(!isNaN(m))fileN+=m});
        break;
      }
    }
    var meta=[];
    for(i=0;i<h;i++){
      var parts=[];
      table[i].forEach(function(v){var t=txt(v);if(t&&!/^\d{4}\.\d{1,2}\.\d{1,2}\.?$/.test(t))parts.push(t)});
      if(parts.length)meta.push(esc(parts.join("  ·  ")));
    }
    $("meta").innerHTML=meta.join("<br>");
    $("classes").innerHTML=cls.map(function(c){
      var a=per[c],m=a.length?a.reduce(function(x,y){return x+y},0)/a.length:0;
      return '<div class="cls"><svg aria-hidden="true"><use href="#b"/></svg><b>'+num(table[h][c])+'반</b><small>응시 '+a.length+'명 · 평균 '+(a.length?fmt(m):"-")+'</small></div>';
    }).join("");
    $("classcard").hidden=false;
    var m="학급 "+cls.length+"개, 응시 "+scores.length+"명";
    if(absent)m+=" (미응시 등 문자로 표시된 "+absent+"칸 제외)";
    if(fileN!==null)m+=fileN===scores.length?" · 파일의 응시인원 합계와 일치합니다.":" · 파일의 응시인원 합계는 "+fileN+"명으로 계산값과 다릅니다.";
    st.textContent=fname+" · "+m;
    calc();
  }

  $("file").onchange=function(e){if(e.target.files[0])loadFile(e.target.files[0])};
  var drop=$("drop");
  ["dragenter","dragover"].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add("over")})});
  ["dragleave","drop"].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove("over")})});
  drop.addEventListener("drop",function(e){var f=e.dataTransfer.files[0];if(f)loadFile(f)});
  $("round").onchange=calc;
  $("preset").onchange=function(e){
    if(PRESETS[e.target.value]){ratios=PRESETS[e.target.value].slice();renderRatios();calc()}
  };
  renderRatios();
  calc();
})();
</script>
